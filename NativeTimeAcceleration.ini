[Settings]
; ============================================================================
; CONFIGURACIÓN ESTRUCTURAL DEL SISTEMA (BIFURCACIÓN DE MODOS DE MOTOR)
; ============================================================================
; 0 = Modo Clásico (Legacy). Alterna estáticamente la velocidad con atajos de teclado, 
;     arrastrando el déficit algorítmico del residuo temporal (ideal para depuración bruta).
;     Cero dependencias de eventos del motor: no registra sinks, no lanza hilos auxiliares.
; 1 = Motor de Cambio de Marcha (Gear-Shifting Engine). El subsistema calculará matemáticamente
;     los segundos sobrantes y ejecutará un 'downshift' dinámico asíncrono para evitar la 
;     pérdida de horas y absorber solicitudes menores a la longitud del ciclo.
;
bEnableGearShiftEngine=1

; ============================================================================
; CONFIGURACIÓN DE LA VELOCIDAD DEL MENÚ DE DESCANSO / ESPERA
; ============================================================================
; Define cuántas horas in-game avanzan por cada iteración del bucle interno del motor.
; 
; Opciones válidas y sus perfiles de estabilidad matemática:
; 2 = 2 Horas por salto (Altamente conservador)
; 3 = 3 Horas por salto (RECOMENDADO. Límite de equilibrio estadístico para la simulación).
; 4 = 4 Horas por salto (Límite extremo. Otorga aceleración masiva a costa de precisión).
;
; ADVERTENCIA CRÍTICA: Valores numéricos superiores a 4 causan un desbordamiento masivo (overflow)
; en el calendario interno del Creation Engine 2 provocando la interrupción prematura de la espera.
; Cualquier valor inválido forzará automáticamente una reconversión de seguridad al valor óptimo (3).
HoursPerTick=3

; ============================================================================
; CONFIGURACIÓN AVANZADA DE MONITOREO Y CONCURRENCIA
; ============================================================================
; 1 = Activa el probe de verificación empírica. Registra 2-3 líneas por sesión
;     de Dormir/Esperar (una al inicio, una al cierre con el resumen de contadores
;     Hour/Hours/Days, y opcionalmente una de coincidencia o divergencia).
;     Fuera de sesiones no emite nada: los eventos de tiempo del motor solo
;     incrementan contadores internos, no escriben al log. Útil para validar
;     la aritmética del motor durante pruebas; irrelevante para el juego normal.
; 0 = Probe silenciado. Cero líneas de diagnóstico de sesión.
bEnableVerificationProbe=0

[Hotkeys]
; ============================================================================
; ASIGNACIÓN DE TECLAS DE HARDWARE (EXCLUSIVO PARA MODO CLÁSICO)
; ============================================================================
; Tecla modificadora que debe mantenerse presionada (ej., Shift, Ctrl, Alt). 
; Si prefieres usar una sola tecla sin combinación, establece este valor en 0.
;
; Ejemplos de Modificadores comunes:
; 16 = Shift
; 17 = Ctrl
; 18 = Alt
; 0  = Desactivado (Prescinde del modificador, usando solo la tecla principal)
ModifierKey=16

; Tecla principal para alternar entre el modo Turbo calculado y el modo Vanilla (1 hora).
; El valor por defecto es 84 (Corresponde a la tecla 'T').
;
; MATRIZ DE REFERENCIA DE TECLAS VIRTUALES (Virtual Key Codes):
; --- ALFABETO ---      --- NÚMEROS Y F ---          --- NAVEGACIÓN Y SISTEMA ---
; A = 65    N = 78      0 = 48       F1  = 112       Backspace = 8     Insert = 45
; B = 66    O = 79      1 = 49       F2  = 113       Tab       = 9     Delete = 46
; C = 67    P = 80      2 = 50       F3  = 114       Enter     = 13    Home   = 36
; D = 68    Q = 81      3 = 51       F4  = 115       Shift     = 16    End    = 35
; E = 69    R = 82      4 = 52       F5  = 116       Ctrl      = 17    PageUp = 33
; F = 70    S = 83      5 = 53       F6  = 117       Alt       = 18    PageDn = 34
; G = 71    T = 84      6 = 54       F7  = 118       Pause     = 19    Up     = 38
; H = 72    U = 85      7 = 55       F8  = 119       CapsLock  = 20    Down   = 40
; I = 73    V = 86      8 = 56       F9  = 120       Esc       = 27    Left   = 37
; J = 74    W = 87      9 = 57       F10 = 121       Space     = 32    Right  = 39
; K = 75    X = 88                   F11 = 122
; L = 76    Y = 89      --- TECLADO NUMÉRICO ---     F12 = 123
; M = 77    Z = 90      Num0 = 96    Num5 = 101      Num * = 106       Num + = 107
;                       Num1 = 97    Num6 = 102      Num - = 109       Num . = 110
;                       Num2 = 98    Num7 = 103      Num / = 111
;                       Num3 = 99    Num8 = 104
;                       Num4 = 100   Num9 = 105
MainKey=84